<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Help</title>
<style>
:root{--bg:#0b1020;--card:#161d33;--tx:#fff;--mut:#94a3b8;--ac:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--tx)}
header{padding:30px 20px 24px;text-align:center;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:0 0 28px 28px}
h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.9;font-size:14px}
#q{display:block;width:calc(100% - 32px);margin:16px;padding:14px;border:0;border-radius:14px;background:var(--card);color:var(--tx);font-size:16px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
#cats button{flex:none;padding:8px 16px;border:0;border-radius:20px;background:var(--card);color:var(--mut);font-size:14px}
#cats button.on{background:var(--ac);color:#fff}
#list{padding:0 16px 30px}
.card{display:flex;gap:12px;background:var(--card);padding:14px;border-radius:14px;margin-bottom:12px}
.ic{flex:none;width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:26px}
.info{flex:1}
.info b{display:block;font-size:16px}
.info small{color:var(--mut);display:block;margin:4px 0 8px}
.tag{font-size:11px;color:var(--ac)}
a.go{display:inline-block;margin-top:6px;padding:8px 16px;border-radius:10px;background:var(--ac);color:#fff;text-decoration:none;font-size:14px}
#none{text-align:center;color:var(--mut);padding:30px}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6366f1"></head>
<body>
<header>
<h1>🎓 Student Help</h1>
<p>Sarkari services, ek hi jagah</p>
</header>
<input id="q" placeholder="🔍 Search karo (jaise NSP, loan)">
<div id="cats"></div>
<div id="list"></div>
<script>
var D=[
{id:1,title:"ABC ID (Academic Bank)",description:"Admission aur Exam ke liye zaroori ID",official_link:"https://www.abc.gov.in",category:"Identity"},
{id:2,title:"DigiLocker",description:"Apni Marksheet download karein",official_link:"https://www.digilocker.gov.in",category:"Identity"},
{id:3,title:"NSP Scholarship",description:"Sarkari chhatravriti form bharein",official_link:"https://scholarships.gov.in",category:"Scholarship"},
{id:4,title:"NTA Exams (JEE/NEET/CUET)",description:"Entrance Exams ke application",official_link:"https://exams.nta.ac.in",category:"Exams"},
{id:5,title:"SSC Jobs",description:"10th/12th pass ke liye sarkari naukri",official_link:"https://ssc.gov.in",category:"Jobs"},
{id:6,title:"Education Loan",description:"Padhai ke liye sasta sarkari loan",official_link:"https://www.vidyalakshmi.co.in",category:"Finance"}
];
var E={Identity:"🪪",Scholarship:"🎓",Exams:"📝",Jobs:"💼",Finance:"💰"};
var cat="All";
var cs=["All"].concat(D.map(function(x){return x.category}).filter(function(v,i,a){return a.indexOf(v)==i}));
function draw(){
var q=document.getElementById("q").value.toLowerCase();
document.getElementById("cats").innerHTML=cs.map(function(c){return '<button class="'+(c==cat?'on':'')+'" onclick="cat=\''+c+'\';draw()">'+c+'</button>'}).join("");
var r=D.filter(function(x){return (cat=="All"||x.category==cat)&&(x.title+x.description).toLowerCase().indexOf(q)>-1});
document.getElementById("list").innerHTML=r.length?r.map(function(x){return '<div class="card"><div class="ic">'+(E[x.category]||"📌")+'</div><div class="info"><span class="tag">'+x.category+'</span><b>'+x.title+'</b><small>'+x.description+'</small><a class="go" href="'+x.official_link+'" target="_blank" rel="noopener">Open ↗</a></div></div>'}).join(""):'<div id="none">Kuch nahi mila 😕</div>';
}
document.getElementById("q").oninput=draw;
draw();
</script>
<script src="login.js?v=5"></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script></body>
</html>
